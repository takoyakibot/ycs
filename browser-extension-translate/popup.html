<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Audio Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
      color: white;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .controls {
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label { font-size: 12px; color: #555; white-space: nowrap; }

    select, input[type="text"], input[type="password"] {
      flex: 1;
      font-size: 12px;
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    input[type="range"] { flex: 1; }

    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-start {
      background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
      color: white;
      width: 100%;
    }

    .btn-start.capturing {
      background: #e53935;
    }

    .btn-start:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #partial-options { display: none; }
    #partial-options.visible { display: flex; }

    .log-area {
      height: 250px;
      overflow-y: auto;
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.6;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #f5f5f5;
      user-select: text;
    }

    .log-original {
      color: #888;
      font-size: 11px;
    }

    .log-translated {
      color: #1565c0;
    }

    .status {
      padding: 4px 14px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .api-key-section {
      padding: 0 14px 12px;
    }

    .api-key-row {
      display: flex;
      gap: 4px;
    }

    .btn-save {
      padding: 4px 10px;
      font-size: 11px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .api-status {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">Tab Audio Translator</div>

  <div class="controls">
    <div class="row">
      <label for="lang">言語:</label>
      <select id="lang">
        <option value="ko">韓国語</option>
        <option value="en">英語</option>
      </select>
    </div>

    <div class="row">
      <label for="mode">翻訳:</label>
      <select id="mode">
        <option value="full">全文翻訳</option>
        <option value="partial">部分翻訳</option>
      </select>
    </div>

    <div class="row" id="partial-options">
      <label for="partial-n">間隔:</label>
      <input type="range" id="partial-n" min="2" max="8" value="3">
      <span id="partial-n-value">3単語に1語</span>
    </div>

    <button class="btn btn-start" id="start-btn" disabled>開始</button>
    <div class="status" id="status">DeepL APIキーを設定してください</div>
  </div>

  <div class="api-key-section">
    <label>DeepL API Free キー:</label>
    <div class="api-key-row">
      <input type="password" id="deepl-key" placeholder="xxxxxxxx-xxxx-...">
      <button class="btn-save" id="save-key">保存</button>
    </div>
    <div class="api-status" id="key-status"></div>
  </div>

  <div class="log-area" id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
