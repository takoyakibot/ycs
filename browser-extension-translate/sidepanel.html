<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Tab Audio Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 13px;
      color: #333;
      background: #f8f9fa;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
      color: white;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }

    details {
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
      flex-shrink: 0;
    }

    summary {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    summary::before {
      content: '▶ ';
      font-size: 10px;
    }

    details[open] > summary::before {
      content: '▼ ';
    }

    summary::-webkit-details-marker { display: none; }

    summary:hover { background: #f5f5f5; }

    .section-content {
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 12px;
      color: #555;
      white-space: nowrap;
    }

    select, input[type="text"], input[type="password"] {
      flex: 1;
      font-size: 12px;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }

    input[type="range"] { flex: 1; }

    .video-label {
      font-size: 10px;
      color: #999;
      margin: 2px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    textarea {
      width: 100%;
      font-size: 12px;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      resize: vertical;
      font-family: inherit;
    }

    .status {
      font-size: 11px;
      color: #888;
      text-align: center;
      padding: 4px 0;
    }

    .api-key-group { margin-top: 4px; }
    .api-key-group label { display: block; margin-bottom: 2px; }

    .api-key-row {
      display: flex;
      gap: 4px;
    }

    .btn-save {
      padding: 5px 12px;
      font-size: 11px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .api-status {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }

    #partial-options { display: none; }
    #partial-options.visible { display: flex; }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .results-title {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }

    .results-count {
      font-size: 10px;
      color: #999;
      margin-left: 4px;
    }

    .btn-clear {
      font-size: 11px;
      color: #e53935;
      background: none;
      border: 1px solid #e53935;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
    }

    .btn-clear:hover { background: #ffebee; }

    .results-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      background: #fff;
      min-height: 0;
    }

    .log-entry {
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      user-select: text;
    }

    .log-elapsed {
      color: #1976d2;
      font-weight: 600;
      font-family: monospace;
      font-size: 11px;
    }

    .log-original {
      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }

    .log-translated {
      color: #1565c0;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      color: #ccc;
      padding: 40px 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">Tab Audio Translator</div>

  <details id="settings-section" open>
    <summary>設定</summary>
    <div class="section-content">
      <div class="row">
        <label for="lang">言語:</label>
        <select id="lang">
          <option value="ko">韓国語</option>
          <option value="en">英語</option>
        </select>
      </div>
      <div class="row">
        <label for="mode">翻訳:</label>
        <select id="mode">
          <option value="full">全文翻訳</option>
          <option value="partial">部分翻訳</option>
        </select>
      </div>
      <div class="row" id="partial-options">
        <label for="partial-n">間隔:</label>
        <input type="range" id="partial-n" min="2" max="8" value="3">
        <span id="partial-n-value">3単語に1語</span>
      </div>
      <div class="row">
        <label for="chunk-interval">取得間隔:</label>
        <input type="range" id="chunk-interval" min="5" max="30" step="5" value="10">
        <span id="chunk-interval-value">10秒</span>
      </div>
      <div>
        <label for="context">動画コンテキスト:</label>
        <div class="video-label" id="video-label"></div>
        <textarea id="context" rows="3" placeholder="動画タイトル、出演者名、トピックなど"></textarea>
      </div>
      <div class="status" id="status">キャプチャの開始/停止はポップアップから操作してください</div>
    </div>
  </details>

  <details id="apikey-section">
    <summary>APIキー</summary>
    <div class="section-content">
      <div class="api-key-group">
        <label>OpenAI (Whisper):</label>
        <div class="api-key-row">
          <input type="password" id="openai-key" placeholder="sk-...">
          <button class="btn-save" id="save-openai-key">保存</button>
        </div>
        <div class="api-status" id="openai-key-status"></div>
      </div>
      <div class="api-key-group">
        <label>DeepL API Free:</label>
        <div class="api-key-row">
          <input type="password" id="deepl-key" placeholder="xxxxxxxx-xxxx-...">
          <button class="btn-save" id="save-deepl-key">保存</button>
        </div>
        <div class="api-status" id="deepl-key-status"></div>
      </div>
    </div>
  </details>

  <div class="results-header">
    <div>
      <span class="results-title">翻訳結果</span>
      <span class="results-count" id="results-count"></span>
    </div>
    <button class="btn-clear" id="clear-btn">クリア</button>
  </div>

  <div class="results-area" id="log">
    <div class="empty-state" id="empty-state">翻訳結果がここに表示されます</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
