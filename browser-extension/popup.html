<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌枠タイムスタンプ検出</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 16px;
    }

    .status-card {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      color: #666;
      font-size: 13px;
    }

    .status-value {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #999;
    }

    .status-dot.active {
      background: #4caf50;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-start {
      background: #4caf50;
      color: white;
    }

    .btn-start:hover {
      background: #43a047;
    }

    .btn-stop {
      background: #f44336;
      color: white;
    }

    .btn-stop:hover {
      background: #e53935;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .section {
      margin-top: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timestamps-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
    }

    .timestamp-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .timestamp-item:last-child {
      border-bottom: none;
    }

    .timestamp-item:hover {
      background: #f5f5f5;
    }

    .timestamp-time {
      font-family: 'Consolas', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #1976d2;
      min-width: 70px;
    }

    .timestamp-label {
      flex: 1;
      color: #666;
      font-size: 12px;
    }

    .empty-state {
      padding: 24px;
      text-align: center;
      color: #999;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .settings-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-label {
      font-size: 13px;
      color: #666;
    }

    .setting-input {
      width: 80px;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      text-align: right;
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .info-message {
      background: #e3f2fd;
      color: #1565c0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>歌枠タイムスタンプ検出</h1>
    <p>音量変化から楽曲開始を自動検出</p>
  </div>

  <div class="content">
    <div id="error-container"></div>
    <div id="info-container"></div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">ステータス</span>
        <span class="status-value">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">停止中</span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">検出数</span>
        <span class="status-value" id="count">0</span>
      </div>
    </div>

    <button class="btn btn-start" id="toggle-btn">
      <span id="btn-icon">▶</span>
      <span id="btn-text">検出開始</span>
    </button>

    <div class="section">
      <div class="section-title">検出されたタイムスタンプ</div>
      <div class="timestamps-list" id="timestamps-list">
        <div class="empty-state">まだ検出されていません</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="copy-btn">コピー</button>
        <button class="btn btn-secondary" id="clear-btn">クリア</button>
        <button class="btn btn-secondary" id="toggle-overlay-btn">オーバーレイ</button>
      </div>
    </div>

    <details class="settings-section">
      <summary class="section-title" style="cursor: pointer;">設定</summary>
      <div style="padding-top: 12px;">
        <div class="setting-row">
          <span class="setting-label">音量しきい値</span>
          <input type="number" class="setting-input" id="volume-threshold"
                 min="0.01" max="1" step="0.01" value="0.15">
        </div>
        <div class="setting-row">
          <span class="setting-label">静音しきい値</span>
          <input type="number" class="setting-input" id="quiet-threshold"
                 min="0.01" max="1" step="0.01" value="0.05">
        </div>
        <div class="setting-row">
          <span class="setting-label">静音最小時間(秒)</span>
          <input type="number" class="setting-input" id="quiet-duration"
                 min="0.5" max="10" step="0.5" value="1.0">
        </div>
        <div class="setting-row">
          <span class="setting-label">クールダウン(秒)</span>
          <input type="number" class="setting-input" id="cooldown"
                 min="1" max="30" step="1" value="3">
        </div>
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
