<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌枠タイムスタンプ検出</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .content {
      padding: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .toggle-row label {
      cursor: pointer;
      font-size: 13px;
    }

    .info-message {
      background: #e3f2fd;
      color: #1565c0;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
    }

    .help-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      color: #666;
      font-size: 12px;
      text-decoration: none;
    }

    .help-link:hover {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>歌枠タイムスタンプ検出</h1>
  </div>

  <div class="content">
    <div id="info-container"></div>

    <div class="toggle-row">
      <input type="checkbox" id="show-embedded-ui" checked>
      <label for="show-embedded-ui">YouTube画面にUIを表示</label>
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="hide-google-ai" checked>
      <label for="hide-google-ai">Google検索のAI概要を非表示</label>
    </div>

    <a href="#" class="help-link" id="help-link">使い方を見る</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
