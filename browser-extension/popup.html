<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌枠タイムスタンプ検出</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .content {
      padding: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .toggle-row label {
      cursor: pointer;
      font-size: 13px;
    }

    .info-message {
      background: #e3f2fd;
      color: #1565c0;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
    }

    .help-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      color: #666;
      font-size: 12px;
      text-decoration: none;
    }

    .help-link:hover {
      color: #333;
    }

    /* スキャン済み一覧セクション */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-top: 16px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #eee;
    }

    .scanned-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .scanned-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 12px;
    }

    .scanned-item:last-child {
      border-bottom: none;
    }

    .scanned-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .scanned-video-id {
      font-family: monospace;
      color: #1a73e8;
      cursor: pointer;
      text-decoration: none;
    }

    .scanned-video-id:hover {
      text-decoration: underline;
    }

    .scanned-date {
      color: #888;
      font-size: 11px;
    }

    .scanned-actions {
      display: flex;
      gap: 4px;
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-open {
      background: #e3f2fd;
      color: #1565c0;
    }

    .btn-open:hover {
      background: #bbdefb;
    }

    .btn-delete {
      background: #ffebee;
      color: #c62828;
    }

    .btn-delete:hover {
      background: #ffcdd2;
    }

    .btn-clear-all {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 12px;
      background: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-clear-all:hover {
      background: #eee;
    }

    .empty-message {
      color: #999;
      font-size: 12px;
      text-align: center;
      padding: 12px 0;
    }

    .btn-scan {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-scan:hover {
      opacity: 0.9;
    }

    .btn-scan:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-scan.scanning {
      background: #f57c00;
    }

    .scan-status {
      margin-top: 6px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>歌枠タイムスタンプ検出</h1>
  </div>

  <div class="content">
    <div id="info-container"></div>

    <div class="toggle-row">
      <input type="checkbox" id="show-embedded-ui" checked>
      <label for="show-embedded-ui">YouTube画面にUIを表示</label>
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="hide-google-ai" checked>
      <label for="hide-google-ai">Google検索のAI概要を非表示</label>
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="chat-delay-enabled">
      <label for="chat-delay-enabled">チャット遅延送信</label>
    </div>
    <div id="chat-delay-options" style="display: none; padding: 4px 0 4px 28px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555;">
        <input type="range" id="chat-delay-seconds" min="3" max="30" value="10" style="flex: 1; cursor: pointer;">
        <span id="chat-delay-value">10秒</span>
      </div>
      <div class="toggle-row" style="padding: 4px 0 0;">
        <input type="checkbox" id="toxicity-check-enabled" style="width: 14px; height: 14px;">
        <label for="toxicity-check-enabled" style="font-size: 12px;">AI毒性チェック</label>
      </div>
      <div id="api-key-section" style="display: none; margin-top: 6px;">
        <div style="display: flex; align-items: center; gap: 4px;">
          <input type="password" id="claude-api-key" placeholder="sk-ant-..." style="flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;">
          <button id="save-api-key" style="font-size: 11px; padding: 4px 8px; background: #667eea; color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">保存</button>
        </div>
        <div id="api-key-status" style="font-size: 10px; color: #888; margin-top: 3px;"></div>
      </div>
    </div>

    <!-- YCS API設定 -->
    <div class="section-title">YCS API設定</div>
    <div style="font-size: 12px; color: #666; margin-bottom: 8px;">字幕データの自動送信に使用します</div>
    <div style="margin-bottom: 6px;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <input type="text" id="ycs-server-url" placeholder="http://localhost:8000" style="flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px;">
      </div>
      <div style="font-size: 10px; color: #888; margin-top: 2px;">サーバーURL</div>
    </div>
    <div style="margin-bottom: 6px;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <input type="password" id="ycs-api-token" placeholder="トークンを入力..." style="flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;">
        <button id="save-ycs-settings" style="font-size: 11px; padding: 4px 8px; background: #667eea; color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">保存</button>
      </div>
      <div id="ycs-settings-status" style="font-size: 10px; color: #888; margin-top: 2px;">APIトークン</div>
    </div>

    <!-- スキャンボタン（YouTube動画ページ用） -->
    <div id="scan-section" style="display: none; margin-top: 12px;">
      <button id="scan-btn" class="btn-scan">スキャン開始</button>
      <div id="scan-status" class="scan-status"></div>
    </div>

    <!-- スキャン済み一覧 -->
    <div class="section-title">スキャン済み一覧</div>
    <div id="scanned-list" class="scanned-list">
      <div class="empty-message">読み込み中...</div>
    </div>
    <button id="clear-all-btn" class="btn-clear-all" style="display: none;">全てクリア</button>

    <a href="#" class="help-link" id="help-link">使い方を見る</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
