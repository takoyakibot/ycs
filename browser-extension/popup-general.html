<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌枠タイムスタンプ検出（一般版）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .content {
      padding: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .toggle-row label {
      cursor: pointer;
      font-size: 13px;
    }

    .info-message {
      background: #e3f2fd;
      color: #1565c0;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
    }

    .help-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      color: #666;
      font-size: 12px;
      text-decoration: none;
    }

    .help-link:hover {
      color: #333;
    }

    /* スキャン済み一覧セクション */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-top: 16px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #eee;
    }

    .scanned-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .scanned-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 12px;
    }

    .scanned-item:last-child {
      border-bottom: none;
    }

    .scanned-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .scanned-video-id {
      font-family: monospace;
      color: #1a73e8;
      cursor: pointer;
      text-decoration: none;
    }

    .scanned-video-id:hover {
      text-decoration: underline;
    }

    .scanned-date {
      color: #888;
      font-size: 11px;
    }

    .scanned-actions {
      display: flex;
      gap: 4px;
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-open {
      background: #e3f2fd;
      color: #1565c0;
    }

    .btn-open:hover {
      background: #bbdefb;
    }

    .btn-delete {
      background: #ffebee;
      color: #c62828;
    }

    .btn-delete:hover {
      background: #ffcdd2;
    }

    .btn-clear-all {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 12px;
      background: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-clear-all:hover {
      background: #eee;
    }

    .empty-message {
      color: #999;
      font-size: 12px;
      text-align: center;
      padding: 12px 0;
    }

  </style>
</head>
<body>
  <div class="header">
    <h1 id="popup-title">歌枠タイムスタンプ検出（一般版）</h1>
  </div>

  <div class="content">
    <div id="info-container"></div>

    <div class="toggle-row">
      <input type="checkbox" id="show-embedded-ui" checked>
      <label for="show-embedded-ui">YouTube画面にUIを表示</label>
    </div>



    <div class="section-title">音量グラフ設定</div>
    <div style="font-size: 12px; color: #666; margin-bottom: 8px;">グラフの高さ（拡大するほど高くなります）</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
      <label for="graph-base-height" style="font-size: 11px; color: #555; white-space: nowrap;">初期の高さ</label>
      <input type="number" id="graph-base-height" min="40" max="400" step="10" style="width: 70px; font-size: 11px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px;">
      <span style="font-size: 11px; color: #888;">px</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
      <label for="graph-height-step" style="font-size: 11px; color: #555; white-space: nowrap;">拡大1段階あたり</label>
      <input type="number" id="graph-height-step" min="0" max="100" step="5" style="width: 70px; font-size: 11px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px;">
      <span style="font-size: 11px; color: #888;">px</span>
    </div>
    <div id="graph-height-status" style="font-size: 10px; color: #888; margin-bottom: 4px;"></div>



    <div class="section-title">スキャン済み一覧 <span id="storage-usage" style="font-weight: normal; color: #999; font-size: 11px;"></span></div>
    <div id="scanned-list" class="scanned-list">
      <div class="empty-message">読み込み中...</div>
    </div>
    <button id="clear-all-btn" class="btn-clear-all" style="display: none;">全てクリア</button>

    <a href="#" class="help-link" id="help-link">使い方を見る</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
